[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "certiscale"
version = "0.1.0"
description = "CertiScale (衡证): certifiable test-time compute scaling - anytime-valid verification x conformal calibration x budget allocation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "晨星 (CJX0712)" }]
keywords = [
    "test-time compute",
    "e-process",
    "anytime-valid inference",
    "conformal prediction",
    "self-consistency",
    "llm",
]
dependencies = ["numpy>=1.24,<3.0", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
